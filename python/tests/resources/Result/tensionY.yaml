---
solver:
  mechanical: spectral_basic

loadstep:
  - boundary_conditions:
      mechanical:
        F_dot: [[x, 0,      0],
                [0, 1.0e-3, 0],
                [0, 0,      x]]
        P: [[0, x, x],
            [x, x, x],
            [x, x, 0]]
    discretization:
      t: 20
      N: 40
    f_out: 4
