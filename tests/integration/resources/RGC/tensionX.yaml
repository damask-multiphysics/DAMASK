---

solver:
  mechanical: spectral_basic

loadstep:
  - boundary_conditions:
      mechanical:
        F_dot: [[1.0e-3, 0, 0],
                [0,      x, 0],
                [0,      0, x]]
        P: [[x, x, x],
            [x, 0, x],
            [x, x, 0]]
    discretization:
      t: 10
      N: 40
    f_out: 41

  - boundary_conditions:
      mechanical:
        F_dot:
          - - 1.0e-3
            - 0
            - 0
          - - 0
            - x
            - 0
          - - 0
            - 0
            - x
        P:
          - - x
            - x
            - x
          - - x
            - 0
            - x
          - - x
            - x
            - 0
    discretization:
      t: 60
      N: 60
    f_out: 60
